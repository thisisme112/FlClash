name: Vantage installation packages

on:
  push:
    branches:
      - 'build/vantage-packages/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      build_ref:
        type: string
        default: ''
      flutter_version:
        type: string
        default: '3.47.6'
      go_version:
        type: string
        default: '1.27.1'
      ndk_version:
        type: string
        default: r28c

permissions:
  contents: read

concurrency:
  group: vantage-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.6' }}
  GO_VERSION: ${{ inputs.go_version || '1.27.1' }}

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure Windows tools
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $inno = 'C:\Program Files (x86)\Inno Setup 6'
          if (!(Test-Path "$inno\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve and check Flutter code
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-fatal-infos
          exit $LASTEXITCODE
      - name: Build installer and portable archive
        run: dart setup.dart windows --env pre --targets exe,zip
      - name: Verify Windows URL launch integration
        run: flutter test test/common/external_url_test.dart --reporter expanded
      - name: Verify bundled Core integrity
        shell: pwsh
        run: |
          $bundle = 'build\windows\x64\runner\Release'
          foreach ($file in @('FlClash.exe', 'FlClashCore.exe', 'FlClashHelperService.exe', 'flutter_windows.dll', 'manifest.json')) {
            if (!(Test-Path "$bundle\$file")) { throw "Missing $file" }
          }
          $manifest = Get-Content "$bundle\manifest.json" | ConvertFrom-Json
          $actual = (Get-FileHash "$bundle\FlClashCore.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.coreSha256 -ne $actual) { throw 'Bundled Core hash does not match the manifest' }
          git rev-parse HEAD | Out-File dist/build-source.txt -Encoding utf8
          Get-ChildItem dist -Recurse -File | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        id: packages
        with:
          name: FlClash-vantage-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Add a download link to the build summary
        env:
          PACKAGE_ARTIFACT: ${{ steps.packages.outputs.artifact-id }}
        shell: pwsh
        run: |
          $url = "https://nightly.link/${env:GITHUB_REPOSITORY}/actions/artifacts/${env:PACKAGE_ARTIFACT}.zip"
          "[Windows x64 installer and portable ZIP — download without login]($url)" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE != '' && secrets.KEY_ALIAS != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ inputs.ndk_version || 'r28c' }}
          link-to-sdk: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Configure available signing key
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path('android/app/keystore.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          with Path('android/local.properties').open('a') as properties:
              for key, name in [('keyAlias', 'KEY_ALIAS'), ('storePassword', 'STORE_PASSWORD'), ('keyPassword', 'KEY_PASSWORD')]:
                  properties.write('\n' + key + '=' + escape(os.environ[name]))
          PY
      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          printf '{"APP_ENV":"pre"}\n' > env.json
          flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define-from-file=env.json
          mkdir -p dist
          git rev-parse HEAD > dist/build-source.txt
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/FlClash-vantage-android-arm64.apk
          if [ "$HAS_SIGNING" = 'true' ]; then
            echo 'Signed using the configured repository key.' > dist/android-signing.txt
          else
            echo 'Signed using the Android debug key. Application ID: com.follow.clash.dev' > dist/android-signing.txt
          fi
      - uses: actions/upload-artifact@v4
        id: packages
        with:
          name: FlClash-vantage-android-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Add a download link to the build summary
        env:
          PACKAGE_ARTIFACT: ${{ steps.packages.outputs.artifact-id }}
        run: |
          echo "[Android ARM64 APK — download without login](https://nightly.link/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT.zip)" >> "$GITHUB_STEP_SUMMARY"
